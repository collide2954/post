[package]
name = "post-fuzz"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
post-client = { path = "../crates/post-client" }
post-crypto = { path = "../crates/post-crypto" }
post-proto = { path = "../crates/post-proto" }

[[bin]]
name = "client_message"
path = "fuzz_targets/client_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_message"
path = "fuzz_targets/server_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "timestamp"
path = "fuzz_targets/timestamp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "name"
path = "fuzz_targets/name.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_address"
path = "fuzz_targets/server_address.rs"
test = false
doc = false
bench = false

[[bin]]
name = "byte_text"
path = "fuzz_targets/byte_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seed"
path = "fuzz_targets/seed.rs"
test = false
doc = false
bench = false
