[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/collide2954/post"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
fluent-bundle = "0.16.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
iced = { version = "0.14.0", default-features = false, features = ["advanced-shaping", "crisp", "linux-theme-detection", "tiny-skia", "tokio", "wayland", "web-colors", "wgpu", "x11"] }
iced_test = "0.14.0"
jiff = "1.0.1"
post-client = { path = "crates/post-client" }
post-proto = { path = "crates/post-proto" }
post-server = { path = "crates/post-server" }
schemars = "1.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
unic-langid = "0.9.6"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The code has few comments (decision record D-106), thus these lints do not apply.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
