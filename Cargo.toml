[workspace]
resolver = "3"
members = ["crates/*", "tools/site"]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/collide2954/post"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
ed25519-dalek = "3.0.0"
fluent-bundle = "0.16.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
iced = { version = "0.14.0", default-features = false, features = ["advanced-shaping", "crisp", "linux-theme-detection", "tiny-skia", "tokio", "wayland", "web-colors", "wgpu", "x11"] }
iced_test = "0.14.0"
jiff = "1.0.1"
post-client = { path = "crates/post-client" }
post-crypto = { path = "crates/post-crypto" }
post-proto = { path = "crates/post-proto" }
post-rules = { path = "crates/post-rules" }
post-server = { path = "crates/post-server" }
post-testing = { path = "crates/post-testing" }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled", "cache"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
rustls-platform-verifier = "0.7.1"
schemars = "1.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sys-locale = "0.3.2"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
toml = { version = "1.2.2", default-features = false, features = ["display", "parse", "serde", "std"] }
toml_edit = { version = "0.25.20", default-features = false, features = ["display", "parse"] }
unic-langid = "0.9.6"
vstd = "=0.0.0-2026-11-01-0251"
zeroize = "1.9.2"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_only)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The code has few comments (decision record D-106), thus these lints do not apply.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
