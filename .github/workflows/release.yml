name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin post --bin post-server
      - name: Make the archive
        shell: bash
        run: |
          name="post-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          mkdir -p "dist/$name/licenses"
          cp LICENSE README.md CHANGELOG.md "dist/$name/"
          cp crates/post-app/fonts/*-LICENSE.txt "dist/$name/licenses/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/post.exe" "target/${{ matrix.target }}/release/post-server.exe" "dist/$name/"
            (cd dist && 7z a -bd "$name.zip" "$name" > /dev/null)
          else
            cp "target/${{ matrix.target }}/release/post" "target/${{ matrix.target }}/release/post-server" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -r "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: post-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "Post is at the start of its development. Do not use it for real conversations."
            echo
            echo "These builds have no code signature. Windows and macOS show a warning when you start them."
            echo
            awk -v version="$version" '
              /^## / { show = ($2 == version) }
              show && !/^## / { print }
            ' CHANGELOG.md
          } > notes.md
          cat notes.md
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Post ${GITHUB_REF_NAME#v}" --notes-file notes.md --prerelease --verify-tag
