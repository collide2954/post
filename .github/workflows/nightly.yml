name: Nightly

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  mutants:
    name: Mutation tests
    runs-on: ubuntu-latest
    env:
      CARGO_MUTANTS_VERSION: 27.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tool
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: cargo-mutants-${{ runner.os }}-${{ env.CARGO_MUTANTS_VERSION }}
      - if: steps.tool.outputs.cache-hit != 'true'
        run: cargo install cargo-mutants --locked --version "$CARGO_MUTANTS_VERSION"
      - run: cargo mutants --package post-proto --package post-crypto --no-shuffle --colors never --jobs 2
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants
          path: mutants.out

  fuzz:
    name: Fuzz tests
    runs-on: ubuntu-latest
    env:
      CARGO_FUZZ_VERSION: 0.13.2
      SECONDS_FOR_EACH_TARGET: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tool
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ env.CARGO_FUZZ_VERSION }}
      - if: steps.tool.outputs.cache-hit != 'true'
        run: cargo +nightly install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      - run: |
          for target in $(cargo +nightly fuzz list); do
            echo "Fuzz target $target"
            cargo +nightly fuzz run "$target" -- -max_total_time="$SECONDS_FOR_EACH_TARGET"
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  advisories:
    name: Security advisories
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: 0.22.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tool
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}
      - if: steps.tool.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
      - run: cargo deny check advisories

  arm64:
    name: Tests on Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --workspace --locked
